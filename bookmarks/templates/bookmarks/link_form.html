{% extends 'bookmarks/base.html' %}
{% block title %}{{ action }} Link{% endblock %}
{% block content %}
<h2>{{ action }} Link</h2>
<div class="form-container">
    <form method="post" class="link-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn primary">{{ action }}</button>
        <a href="{% url 'bookmarks:link_list' %}" class="btn secondary">Cancel</a>
    </form>
</div>
{% endblock %}
